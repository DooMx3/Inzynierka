# Full stack. Images come from GHCR (tag = VERSION x.y.z, or latest):
#   docker compose up -d
#   IMAGE_TAG=0.1.0 docker compose up -d
name: inzynierka

include:
  - docker-compose.dev.yml

services:
  frontend:
    image: ghcr.io/doomx3/inzynierka-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: inzynierka-frontend
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
