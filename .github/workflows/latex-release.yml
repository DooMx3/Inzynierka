name: Build and publish PDFs from LaTeX

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build LaTeX PDFs and publish to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: get_previous_tag
        run: |
          git fetch --tags
          echo "prev_tag=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1))" >> $GITHUB_ENV
        shell: bash

      - name: Generate commits list from previous tag
        id: generate_commits
        run: |
          echo "Automated build including those changes:" > release_body.txt
          git log ${prev_tag}...HEAD --oneline --pretty=format:"- %s" >> release_body.txt

      - name: Build LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: docs
          # This action uses TeX Live Full by default, covering all your polish/extra requirements
          args: -pdf -halt-on-error -output-directory=build

      - name: Upload PDFs and Create Release
        uses: ncipollo/release-action@v1
        with:
          draft: false
          prerelease: false
          artifacts: 'build/*.pdf'
          bodyFile: ./release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
