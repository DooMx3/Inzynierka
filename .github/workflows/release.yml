name: Release containers

# Version lives in git tags (vX.Y.Z) — never commits to main (branch protection).
# - push to main → z++ (or X.Y.0 if a vX.Y tag is in the push), tag vX.Y.Z, build changed images
# - push of developer tag vX.Y → X.Y.0, tag vX.Y.0, rebuild both
# - push of CI tag vX.Y.Z → no-op (avoids loops)
on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: release-containers-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve version
    # Skip bot commits; three-part tags are created by this workflow itself
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      frontend: ${{ steps.bump.outputs.frontend }}
      backend: ${{ steps.bump.outputs.backend }}
      skip: ${{ steps.bump.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and changed paths
        id: bump
        run: |
          chmod +x .github/scripts/bump-version.sh
          set -euo pipefail

          # CI release tags (vX.Y.Z) — ignore to prevent re-entry loops
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "Ignoring CI release tag ${tag}"
              exit 0
            fi
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
              frontend=true
              backend=true
            else
              echo "Tag '$tag' is not a version tag (expected vX.Y)" >&2
              exit 1
            fi
          else
            version="$(.github/scripts/bump-version.sh "${{ github.event.before }}")"
            frontend=false
            backend=false
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              frontend=true
              backend=true
            else
              mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
              printf 'Changed files:\n%s\n' "${changed[*]-}"
              for f in "${changed[@]-}"; do
                case "$f" in
                  frontend/*|.github/workflows/release.yml|.github/scripts/*)
                    frontend=true
                    ;;
                  backend/*|.github/workflows/release.yml|.github/scripts/*)
                    backend=true
                    ;;
                esac
              done
            fi
          fi

          echo "Resolved version: ${version}"

          # Persist release as a git tag (allowed under branch protection; no push to main)
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v${version}"
            git push origin "v${version}"
            echo "Created tag v${version}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"

  frontend-image:
    name: Frontend image
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/inzynierka-frontend"
          docker build -t "${image}:${VERSION}" ./frontend
          docker tag "${image}:${VERSION}" "${image}:latest"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  backend-image:
    name: Backend image
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/inzynierka-backend"
          mvn -f backend/pom.xml -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName="${image}:${VERSION}"
          docker tag "${image}:${VERSION}" "${image}:latest"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
