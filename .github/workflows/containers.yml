name: Container images

on:
  push:
    branches: [main]

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/inzynierka-backend"
          mvn -f backend/pom.xml -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName="${image}:${GITHUB_SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/inzynierka-frontend"
          docker build -t "${image}:${GITHUB_SHA}" ./frontend
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
